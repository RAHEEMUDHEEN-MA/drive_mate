{% extends 'adminindex.html' %}
{% block body %}
<head>
  <style>
    h6{
color:green;
font-size:22;
display: block;
margin-block-start: 3em;
margin-block-end: 2.2em;
margin-inline-start: 0px;
margin-inline-end: 0px;
font-weight: bold;
}
</style>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Untitled Document</title>
</head>

<body>
<form id="form1" name="form1" method="post" action="reg" width: 736px;>
   <h6 align="center" >ADD NEW MECHANIC </h6>
<table   cellspacing="15"  bordercolor="white" cellpadding="15" align="center" width="800" border="3">
  <tr>
      <th>NAME</th>
      <td><label>
        <input type="text" name="textfield" class="form-control" required pattern="[A-Z a-z.]{3,25}"  />
      </label></td>
    </tr>
    <tr>
      <th>PLACE</th>
      <td><label>
        <input type="text" name="textfield2" class="form-control" required pattern="[A-Z a-z.]{3,50}"  />
      </label></td>
    </tr>
    <tr>
      <th>POST</th>
      <td><label>
        <input type="text" name="textfield3" class="form-control" required pattern="[A-Z a-z.]{3,25}" />
      </label></td>
    </tr>
    <tr>
      <th>PIN</th>
      <td><label>
        <input type="text" name="textfield4" class="form-control" required pattern="[0-9]{6}" />
      </label></td>
    </tr>
    <tr>
      <th>PHONE</th>
      <td><label>
        <input type="text" name="textfield5" class="form-control" required pattern="[6789][0-9]{9}" />
      </label></td>
    </tr>
    <tr>
      <th>EMAIL</th>
      <td><label>
        <input type="text" name="textfield6" class="form-control" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}" />
      </label></td>
    </tr>
    <tr>
      <th>USER NAME </th>
      <td><label>
        <input type="text" name="textfield7" class="form-control" required />
      </label></td>
    </tr>
    <tr>
      <th>PASSWORD</th>
      <td><label>
        <input type="password" name="textfield8" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter and one special character, and at least 8 or more characters" required />
      </label></td>
    </tr>
    <tr>
      <td  align="center" colspan="2"><label>
        <div align="center">
          <input type="submit"  name="Submit" value="ADD" />
          </div>
      </label></td >
    </tr>
  </table>
</form>
</body>
<!--</html>-->
{% endblock %}
